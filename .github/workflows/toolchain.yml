name: Toolchain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - 'docs/examples/**'
      - 'gradle/**'
      - '.gitattributes'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - 'docs/examples/**'
      - 'gradle/**'
      - '.gitattributes'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:
    inputs:
      initialize_native_baseline:
        description: Initialize native size baseline on the default branch
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OpenJDK 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25.0.3
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify Windows launcher core
        run: dotnet test cli/launcher/Norm.Launcher.Tests/Norm.Launcher.Tests.csproj

      - name: Build self-contained CLI
        run: ./gradlew :compiler:installRuntimeDist --no-daemon

      - name: Run quality checks
        run: ./gradlew qualityCheck --no-daemon

      - name: Verify CLI entry point
        run: |
          ./gradlew :compiler:run --args="--version" --no-daemon
          ./gradlew :compiler:run --args="run docs/examples/hello.norm" --no-daemon

      - name: Verify self-contained CLI and language server
        env:
          NORM_CLI: ${{ github.workspace }}/cli/compiler/build/install/norm/bin/norm
        run: |
          node --test cli/compiler/scripts/*.test.mjs
          NORM_VERSION="$(./gradlew properties --no-daemon --console=plain -q | sed -n 's/^version: //p')"
          test -n "$NORM_VERSION"
          node cli/compiler/scripts/verify-cli.mjs "$NORM_CLI" "$NORM_VERSION"
          npm run --prefix cli/extensions/vscode smoke:lsp

      - name: Check native size budget
        env:
          GH_TOKEN: ${{ github.token }}
          NORM_NATIVE_BASELINE_INITIALIZE: ${{ inputs.initialize_native_baseline && 'true' || 'false' }}
        run: node cli/compiler/scripts/native-size-gate.mjs build/reports/native-size

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-size-${{ runner.os }}-${{ runner.arch }}
          path: build/reports/native-size
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
