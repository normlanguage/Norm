name: Toolchain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - 'gradle/**'
      - '.gitattributes'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - 'gradle/**'
      - '.gitattributes'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OpenJDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Windows launcher core
        run: dotnet test cli/launcher/Norm.Launcher.Tests/Norm.Launcher.Tests.csproj

      - name: Build self-contained CLI
        run: ./gradlew :compiler:installRuntimeDist --no-daemon

      - name: Run quality checks
        run: ./gradlew qualityCheck --no-daemon

      - name: Verify language server and evidence tools
        env:
          NORM_CLI: ${{ github.workspace }}/cli/compiler/build/install/norm/bin/norm
        run: |
          node --test cli/compiler/scripts/*.test.mjs
          npm run --prefix cli/extensions/vscode smoke:lsp
