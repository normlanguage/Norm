name: Toolchain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - '.mvn/**'
      - 'build-tools/**'
      - 'build-maven-plugin/**'
      - 'pom.xml'
      - '.gitattributes'
      - 'LICENSE'
      - 'LICENSING.md'
      - 'mvnw'
      - 'mvnw.cmd'
  pull_request:
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - '.mvn/**'
      - 'build-tools/**'
      - 'build-maven-plugin/**'
      - 'pom.xml'
      - '.gitattributes'
      - 'LICENSE'
      - 'LICENSING.md'
      - 'mvnw'
      - 'mvnw.cmd'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OpenJDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify Windows launcher core
        run: dotnet test cli/launcher/Norm.Launcher.Tests/Norm.Launcher.Tests.csproj

      - name: Verify Maven build tools
        env:
          MAVEN_OPTS: -Xmx512m
        run: ./mvnw -B -ntp verify

      - name: Build self-contained CLI
        run: ./mvnw -B -ntp -Dmaven.test.skip=true -Prelease package

      - name: Verify language server and evidence tools
        env:
          NORM_CLI: ${{ github.workspace }}/cli/compiler/target/norm-runtime/bin/norm
        run: |
          node --test cli/compiler/scripts/*.test.mjs
          node cli/compiler/scripts/verify-codegen.mjs
          npm run --prefix cli/extensions/vscode smoke:lsp
