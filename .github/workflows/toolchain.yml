name: Toolchain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - 'docs/examples/**'
      - 'gradle/**'
      - '.gitattributes'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - '.github/workflows/toolchain.yml'
      - '.github/workflows/release.yml'
      - 'cli/**'
      - 'norm/**'
      - 'docs/examples/**'
      - 'gradle/**'
      - '.gitattributes'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OpenJDK 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25.0.3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build self-contained CLI
        run: ./gradlew :compiler:installRuntimeDist --no-daemon

      - name: Run quality checks
        run: ./gradlew qualityCheck --no-daemon

      - name: Verify CLI entry point
        run: |
          ./gradlew :compiler:run --args="--version" --no-daemon
          ./gradlew :compiler:run --args="run docs/examples/hello.norm" --no-daemon

      - name: Verify self-contained CLI and language server
        env:
          NORM_CLI: ${{ github.workspace }}/cli/compiler/build/install/norm/bin/norm
        run: |
          NORM_VERSION="$(./gradlew properties --no-daemon --console=plain -q | sed -n 's/^version: //p')"
          test -n "$NORM_VERSION"
          node cli/compiler/scripts/verify-cli.mjs "$NORM_CLI" "$NORM_VERSION"
          npm run --prefix cli/extensions/vscode smoke:lsp
