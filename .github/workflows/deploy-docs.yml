name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'norm/stdlib/std/**'
      - 'norm/tests/docs/**'
      - 'cli/compiler/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: 25.0.2
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Verify documentation examples
        run: |
          ./mvnw -B -ntp -pl cli/compiler -am '-Dtest=ProgramExecutionTest#runsDocumentationExamples+runsDocumentationProjectExamples' -Dsurefire.failIfNoSpecifiedTests=false -Dnorm.failIfNoTests=false clean test
          report=cli/compiler/target/surefire-reports/TEST-dev.w0fv1.norm.truffle.ProgramExecutionTest.xml
          test -s "$report"
          grep -q 'name="runsDocumentationExamples()' "$report"
          grep -q 'name="runsDocumentationProjectExamples()' "$report"
      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
