name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'java-binding/**/artifacts/**/*.nar'
      - 'modules/**/artifacts/**/*.nar'
      - 'norm/stdlib/std/**'
      - 'norm/tests/docs/**'
      - 'cli/compiler/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Verify documentation examples
        run: ./gradlew :compiler:test --tests "dev.w0fv1.norm.truffle.ProgramExecutionTest.runsDocumentationExamples" --tests "dev.w0fv1.norm.truffle.ProgramExecutionTest.runsDocumentationProjectExamples" --no-daemon
      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build
      - name: Stage Norm package repository
        shell: bash
        run: |
          repository="docs/.vitepress/dist/repository"
          mkdir -p "$repository"
          while IFS= read -r -d '' archive; do
            relative="${archive#*/artifacts/}"
            target="$repository/$relative"
            mkdir -p "$(dirname "$target")"
            cp "$archive" "$target"
            sha256sum "$target" | awk '{print $1}' > "$target.sha256"
          done < <(find java-binding modules -type f -path '*/artifacts/*.nar' -print0)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
