name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'norm/stdlib/std/**'
      - 'norm/tests/docs/**'
      - 'cli/compiler/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: 25.0.2
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Verify documentation examples
        run: |
          report=build/compiler/test-results/test/TEST-dev.w0fv1.norm.truffle.ProgramExecutionTest.xml
          for factory in runsDocumentationExamples runsDocumentationProjectExamples; do
            rm -f "$report"
            ./gradlew :compiler:test --tests "dev.w0fv1.norm.truffle.ProgramExecutionTest.$factory" --no-daemon
            python3 -c 'import sys, xml.etree.ElementTree as ET; suite = ET.parse(sys.argv[1]).getroot(); counts = {key: int(suite.attrib[key]) for key in ("tests", "skipped", "failures", "errors")}; assert counts["tests"] > 0 and not any(counts[key] for key in ("skipped", "failures", "errors")), counts' "$report"
          done
      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
