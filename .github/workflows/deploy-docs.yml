name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'norm/tests/docs/**'
      - 'tool/truffle-backend/src/test/java/dev/w0fv1/norm/testing/NormTestKit.java'
      - 'tool/truffle-backend/src/test/java/dev/w0fv1/norm/truffle/ProgramExecutionTest.java'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Verify documentation examples
        run: ./gradlew :truffle-backend:test --tests "dev.w0fv1.norm.truffle.ProgramExecutionTest.runsDocumentationExamples" --tests "dev.w0fv1.norm.truffle.ProgramExecutionTest.runsDocumentationProjectExamples" --no-daemon
      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
