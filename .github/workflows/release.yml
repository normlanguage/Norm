name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NORM_CANDIDATE_VERSION: '0.25.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Select and validate build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$NORM_CANDIDATE_VERSION"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid build version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Load release targets
        id: targets
        shell: bash
        run: |
          matrix="$(node --input-type=module -e 'import { releaseTargets } from "./cli/compiler/scripts/release-model.mjs"; console.log(JSON.stringify({ include: releaseTargets }));')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up release tools
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify target architecture
        shell: bash
        run: node -e "if (process.platform + '-' + process.arch !== process.argv[1]) process.exit(1)" '${{ matrix.target }}'

      - name: Set up .NET for the Windows executable
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained Unix CLI and release asset
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew :compiler:packageDistribution "-PnormVersion=${{ needs.prepare.outputs.version }}" --no-daemon

      - name: Build self-contained Windows CLI and release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :compiler:packageDistribution "-PnormVersion=${{ needs.prepare.outputs.version }}" --no-daemon

      - name: Verify Unix archive payload
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(node cli/compiler/scripts/release-model.mjs '${{ needs.prepare.outputs.version }}' '${{ matrix.target }}')"
          mkdir -p build/archive-check build/reports/archive
          tar -xpzf "build/distributions/$archive" -C build/archive-check
          node cli/compiler/scripts/verify-runtime-tree.mjs '${{ matrix.distribution }}' build/archive-check/norm 2>&1 | tee build/reports/archive/verification.log

      - name: Upload Unix archive verification
        if: ${{ always() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: archive-verification-${{ matrix.platform }}
          path: build/reports/archive/verification.log
          if-no-files-found: warn

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/release-stage -Force | Out-Null
          Copy-Item -LiteralPath '${{ matrix.distribution }}' -Destination build/release-stage/norm -Recurse

      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/release-stage
          cp -R '${{ matrix.distribution }}' build/release-stage/norm

      - name: Upload standalone CLI
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: build/distributions/*
          if-no-files-found: error

      - name: Upload self-contained CLI for the universal extension
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: build/release-stage
          if-no-files-found: error

  package-extension:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/extensions/vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix cli/extensions/vscode

      - name: Download self-contained CLIs
        uses: actions/download-artifact@v5
        with:
          path: build/binaries
          pattern: runtime-*

      - name: Package universal extension
        run: |
          find build/binaries -path '*/norm/bin/norm' -exec chmod +x {} +
          node cli/extensions/vscode/scripts/release-package.mjs \
            ${{ needs.prepare.outputs.version }} \
            build/binaries \
            build/distributions/norm-language-support-v${{ needs.prepare.outputs.version }}.vsix

      - name: Upload universal extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-universal
          path: build/distributions/norm-language-support-v${{ needs.prepare.outputs.version }}.vsix
          if-no-files-found: error

  verify:
    needs: [prepare, package-extension]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/extensions/vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix cli/extensions/vscode

      - name: Verify release record
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          release_line="${VERSION%.*}"
          test -f "docs/versions/$release_line.md"
          test -f "docs/zh/versions/$release_line.md"

      - name: Verify toolchain
        run: ./gradlew qualityCheck "-PnormVersion=${{ needs.prepare.outputs.version }}" --no-daemon

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-release-verify
          path: |
            build/compiler/test-results/test/*.xml
            build/build-logic/test-results/test/*.xml
          if-no-files-found: warn

      - name: Verify Windows launcher core
        run: dotnet test cli/launcher/Norm.Launcher.Tests/Norm.Launcher.Tests.csproj --artifacts-path build/dotnet

      - name: Verify native build evidence tools
        env:
          NORM_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node --test cli/compiler/scripts/*.test.mjs
          node cli/compiler/scripts/verify-codegen.mjs

      - name: Verify extension
        working-directory: cli/extensions/vscode
        run: |
          npm run check
          npm run test:language
          npm run test:discovery
          npm run test:release

      - name: Download packaged runtimes
        uses: actions/download-artifact@v5
        with:
          path: build/binaries
          pattern: runtime-*

      - name: Download packaged extension
        uses: actions/download-artifact@v5
        with:
          name: extension-universal
          path: build/distributions

      - name: Verify final universal extension
        shell: bash
        run: |
          find build/binaries -path '*/norm/bin/norm' -exec chmod +x {} +
          npm run --prefix cli/extensions/vscode verify:vsix -- ${{ needs.prepare.outputs.version }} "$GITHUB_WORKSPACE/build/binaries" "$GITHUB_WORKSPACE/build/distributions/norm-language-support-v${{ needs.prepare.outputs.version }}.vsix"

  accept:
    needs: [prepare, package-extension]
    env:
      NORM_TEST_EXTENSION: ${{ github.workspace }}/build/extracted-extension
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/extensions/vscode/package-lock.json
      - run: npm ci --prefix cli/extensions/vscode

      - name: Download final CLI
        uses: actions/download-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: build/distributions

      - name: Download final extension
        uses: actions/download-artifact@v5
        with:
          name: extension-universal
          path: build/distributions

      - name: Prepare Windows delivery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = (Resolve-Path build/distributions/norm.exe).Path
          "NORM_CLI=$cli" >> $env:GITHUB_ENV
          & $cli setup
          if ($LASTEXITCODE -ne 0) { throw "Setup failed" }
          & $cli setup
          if ($LASTEXITCODE -ne 0) { throw "Repeated setup failed" }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs\Norm\bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $matches = @($userPath.Split(';') | Where-Object { $_.TrimEnd('\') -ieq $installDirectory.TrimEnd('\') })
          if ($matches.Count -ne 1) { throw "Setup PATH is not idempotent" }
          $installed = Join-Path $installDirectory 'norm.exe'
          if ((& $installed --version) -ne 'norm ${{ needs.prepare.outputs.version }}') { throw "Installed version mismatch" }

      - name: Prepare Unix delivery
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/extracted
          archive="$(node cli/compiler/scripts/release-model.mjs '${{ needs.prepare.outputs.version }}' '${{ matrix.target }}')"
          tar -xzf "build/distributions/$archive" -C build/extracted
          echo "NORM_CLI=$GITHUB_WORKSPACE/build/extracted/norm/bin/norm" >> "$GITHUB_ENV"

      - name: Verify final CLI and native application
        shell: bash
        run: node cli/compiler/scripts/verify-cli.mjs "$NORM_CLI" "${{ needs.prepare.outputs.version }}"

      - name: Extract final extension
        run: node cli/extensions/vscode/scripts/extract-vsix.mjs "build/distributions/norm-language-support-v${{ needs.prepare.outputs.version }}.vsix" build/extracted-extension "${{ needs.prepare.outputs.version }}"

      - name: Verify packaged language server
        working-directory: cli/extensions/vscode
        env:
          NORM_CLI: ${{ github.workspace }}/build/extracted-extension/bin/${{ matrix.target }}/norm/${{ matrix.launcher }}
        run: npm run smoke:lsp

      - name: Verify editor integration
        if: runner.os != 'Linux'
        working-directory: cli/extensions/vscode
        run: npm run test:extension:release

      - name: Verify editor integration on Linux
        if: runner.os == 'Linux'
        working-directory: cli/extensions/vscode
        run: xvfb-run -a npm run test:extension:release

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-size-${{ matrix.platform }}
          path: build/reports/native-size
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  publish:
    needs: [prepare, verify, accept]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Set up release tools
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: build/distributions
          pattern: release-*
          merge-multiple: true

      - name: Download universal extension
        uses: actions/download-artifact@v5
        with:
          path: build/distributions
          name: extension-universal
          merge-multiple: true

      - name: Create checksums
        working-directory: build/distributions
        run: sha256sum norm* > SHA256SUMS

      - name: Generate package manager manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node cli/compiler/scripts/distribution-manifests.mjs "$VERSION" build/distributions build/package-manifests
          tar -C build/package-manifests -czf "build/distributions/norm-package-manifests-v$VERSION.tar.gz" .
          cd build/distributions
          sha256sum "norm-package-manifests-v$VERSION.tar.gz" >> SHA256SUMS

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/distributions/*

      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [[ "$state" == "false" ]]; then
            echo "Release $GITHUB_REF_NAME is already published" >&2
            exit 1
          fi
          if [[ "$state" == "missing" ]]; then
            release_line="${VERSION%.*}"
            notes="Version record: https://normlanguage.github.io/Norm/versions/$release_line

          The Windows and macOS binaries are not code-signed yet, so the operating system may display an origin warning. Verify downloads against SHA256SUMS and the attached build provenance."
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Norm $VERSION" --generate-notes --notes "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" build/distributions/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
