name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Load release targets
        id: targets
        shell: bash
        run: |
          jq -e 'length > 0 and all(.[]; (.runner | type == "string") and (.target | type == "string") and (.platform | type == "string") and (.distribution | type == "string") and (.launcher | type == "string") and ((.standalone == null) or (.standalone | type == "string"))) and (([.[].target] | length) == ([.[].target] | unique | length))' cli/compiler/release-targets.json > /dev/null
          echo "matrix=$(jq -c '{include: .}' cli/compiler/release-targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up .NET for the Windows executable
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained CLI
        shell: bash
        run: ./gradlew :compiler:installRuntimeDist "-PnormVersion=${{ needs.prepare.outputs.version }}" --no-daemon

      - name: Build portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :compiler:publishWindowsExecutable "-PnormVersion=${{ needs.prepare.outputs.version }}" --no-daemon

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          New-Item -ItemType Directory -Path release-stage -Force | Out-Null
          Copy-Item -LiteralPath '${{ matrix.distribution }}' -Destination release-stage/norm -Recurse
          Copy-Item -LiteralPath '${{ matrix.standalone }}' -Destination 'release/norm.exe'

      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          mkdir -p release-stage
          cp -R '${{ matrix.distribution }}' release-stage/norm
          archive="release/norm-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz"
          tar -C release-stage -czf "$archive" norm

      - name: Upload standalone CLI
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

      - name: Upload self-contained CLI for the universal extension
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: release-stage
          if-no-files-found: error

  package-extension:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/extensions/vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix cli/extensions/vscode

      - name: Download self-contained CLIs
        uses: actions/download-artifact@v5
        with:
          path: binaries
          pattern: runtime-*

      - name: Package universal extension
        run: |
          find binaries -path '*/norm/bin/norm' -exec chmod +x {} +
          node cli/extensions/vscode/scripts/release-package.mjs \
            ${{ needs.prepare.outputs.version }} \
            binaries \
            release/norm-language-support-v${{ needs.prepare.outputs.version }}.vsix

      - name: Upload universal extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-universal
          path: release/norm-language-support-v${{ needs.prepare.outputs.version }}.vsix
          if-no-files-found: error

  verify:
    needs: [prepare, package-extension]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/extensions/vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix cli/extensions/vscode

      - name: Verify release record
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          release_line="${VERSION%.*}"
          test -f "docs/versions/$release_line.md"
          test -f "docs/en/versions/$release_line.md"

      - name: Verify toolchain
        run: ./gradlew qualityCheck "-PnormVersion=${{ needs.prepare.outputs.version }}" --no-daemon

      - name: Verify Windows launcher core
        run: dotnet test cli/launcher/Norm.Launcher.Tests/Norm.Launcher.Tests.csproj

      - name: Verify native build evidence tools
        run: node --test cli/compiler/scripts/*.test.mjs

      - name: Verify extension
        working-directory: cli/extensions/vscode
        run: |
          npm run check
          npm run test:language
          npm run test:discovery
          npm run test:release

      - name: Download packaged runtimes
        uses: actions/download-artifact@v5
        with:
          path: binaries
          pattern: runtime-*

      - name: Download packaged extension
        uses: actions/download-artifact@v5
        with:
          name: extension-universal
          path: release

      - name: Verify final universal extension
        shell: bash
        run: |
          find binaries -path '*/norm/bin/norm' -exec chmod +x {} +
          npm run --prefix cli/extensions/vscode verify:vsix -- ${{ needs.prepare.outputs.version }} "$GITHUB_WORKSPACE/binaries" "$GITHUB_WORKSPACE/release/norm-language-support-v${{ needs.prepare.outputs.version }}.vsix"

  accept:
    needs: [prepare, package-extension]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/extensions/vscode/package-lock.json
      - run: npm ci --prefix cli/extensions/vscode

      - name: Download final CLI
        uses: actions/download-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: release

      - name: Download packaged runtime
        uses: actions/download-artifact@v5
        with:
          name: runtime-${{ matrix.target }}
          path: binaries/runtime-${{ matrix.target }}

      - name: Prepare Windows delivery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = (Resolve-Path release/norm.exe).Path
          "NORM_CLI=$cli" >> $env:GITHUB_ENV
          & $cli setup
          if ($LASTEXITCODE -ne 0) { throw "Setup failed" }
          & $cli setup
          if ($LASTEXITCODE -ne 0) { throw "Repeated setup failed" }
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs\Norm\bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $matches = @($userPath.Split(';') | Where-Object { $_.TrimEnd('\') -ieq $installDirectory.TrimEnd('\') })
          if ($matches.Count -ne 1) { throw "Setup PATH is not idempotent" }
          $installed = Join-Path $installDirectory 'norm.exe'
          if ((& $installed --version) -ne 'norm ${{ needs.prepare.outputs.version }}') { throw "Installed version mismatch" }

      - name: Prepare Unix delivery
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p extracted
          tar -xzf "release/norm-v${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz" -C extracted
          echo "NORM_CLI=$GITHUB_WORKSPACE/extracted/norm/bin/norm" >> "$GITHUB_ENV"

      - name: Verify final CLI and native application
        shell: bash
        run: node cli/compiler/scripts/verify-cli.mjs "$NORM_CLI" "${{ needs.prepare.outputs.version }}"

      - name: Stage packaged editor runtime
        run: node --input-type=module -e "import { stageCliBundle } from './cli/extensions/vscode/scripts/release-package.mjs'; stageCliBundle('binaries', 'cli/extensions/vscode', '${{ matrix.target }}');"

      - name: Verify packaged language server
        working-directory: cli/extensions/vscode
        env:
          NORM_CLI: ${{ github.workspace }}/cli/extensions/vscode/bin/${{ matrix.target }}/norm/${{ matrix.launcher }}
        run: npm run smoke:lsp

      - name: Verify editor integration
        if: runner.os != 'Linux'
        working-directory: cli/extensions/vscode
        run: npm run test:extension:release

      - name: Verify editor integration on Linux
        if: runner.os == 'Linux'
        working-directory: cli/extensions/vscode
        run: xvfb-run -a npm run test:extension:release

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-size-${{ matrix.platform }}
          path: build/reports/native-size
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  publish:
    needs: [prepare, verify, accept]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Download universal extension
        uses: actions/download-artifact@v5
        with:
          path: release
          name: extension-universal
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum norm* > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*

      - name: Publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [[ "$state" == "false" ]]; then
            echo "Release $GITHUB_REF_NAME is already published" >&2
            exit 1
          fi
          if [[ "$state" == "missing" ]]; then
            release_line="${VERSION%.*}"
            notes="Version record: https://normlanguage.github.io/Norm/en/versions/$release_line

          The Windows and macOS binaries are not code-signed yet, so the operating system may display an origin warning. Verify downloads against SHA256SUMS and the attached build provenance."
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Norm $VERSION" --generate-notes --notes "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
