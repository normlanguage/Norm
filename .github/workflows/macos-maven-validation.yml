name: macOS Maven validation

on:
  push:
    branches:
      - codex/macos-maven-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    env:
      NORM_CANDIDATE_VERSION: 0.24.0
      NORM_TARGET: darwin-arm64
    steps:
      - name: Check out candidate sources
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 25.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Record source and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          test -z "$(git status --porcelain)"
          test "$(uname -m)" = arm64
          git rev-parse HEAD | tee validation-evidence/source-commit.txt
          {
            uname -a
            java -version
            mvn -version
            node --version
          } 2>&1 | tee validation-evidence/tools.log

      - name: Build Maven release tree
        shell: bash
        run: |
          set -euo pipefail
          mvn -B "-Drevision=$NORM_CANDIDATE_VERSION" -Dmaven.test.skip=true -Prelease clean package 2>&1 | tee validation-evidence/maven-package.log

      - name: Package and verify macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          {
            runtime=cli/compiler/target/norm-runtime
            compiler_jar="cli/compiler/target/compiler-$NORM_CANDIDATE_VERSION.jar"
            for name in LICENSE LICENSING.md; do
              unzip -p "$compiler_jar" "META-INF/$name" | cmp - "$name"
              cmp "$name" "$runtime/$name"
            done
            jar tf "$compiler_jar" | grep -Fx graalvm-reachability-metadata.zip
            cmp "$compiler_jar" "$runtime/lib/compiler-$NORM_CANDIDATE_VERSION.jar"
            mkdir -p release release-stage extracted
            cp -R "$runtime" release-stage/norm
            asset="$(node cli/compiler/scripts/release-model.mjs "$NORM_CANDIDATE_VERSION" "$NORM_TARGET")"
            tar -C release-stage -czf "release/$asset" norm
            tar -xzf "release/$asset" -C extracted
            diff -rq "$runtime" extracted/norm
            echo runtime_tree=identical
            shasum -a 256 "$compiler_jar" "release/$asset" | tee validation-evidence/asset-sha256.txt
            version="$(extracted/norm/bin/norm --version)"
            echo "$version"
            test "$version" = "norm $NORM_CANDIDATE_VERSION"
            hello="$(extracted/norm/bin/norm run cli/compiler/scripts/fixtures/hello.norm)"
            echo "$hello"
            test "$hello" = 'Hello from Norm'
            mkdir -p "binaries/runtime-$NORM_TARGET"
            cp -R extracted/norm "binaries/runtime-$NORM_TARGET/norm"
            node --input-type=module <<'NODE'
          import { existsSync } from 'node:fs';
          import { join } from 'node:path';
          import { stageCliBundle, targetLauncher, targetRuntimeJava } from './cli/extensions/vscode/scripts/release-package.mjs';
          const target = process.env.NORM_TARGET;
          stageCliBundle('binaries', 'validation-work/extension-input', target);
          for (const relative of [targetLauncher(target), targetRuntimeJava(target)]) {
            if (!existsSync(join('validation-work/extension-input/bin', target, relative))) {
              throw new Error(`Missing VSIX input: ${relative}`);
            }
          }
          console.log('vsix_input_layout=pass');
          NODE
          } 2>&1 | tee validation-evidence/macos-runtime.log

      - name: Verify language server
        shell: bash
        run: |
          set -euo pipefail
          node cli/compiler/scripts/verify-lsp.mjs extracted/norm validation-evidence/lsp 2>&1 | tee validation-evidence/lsp.log

      - name: Verify CLI and native application
        shell: bash
        run: |
          set -euo pipefail
          node cli/compiler/scripts/verify-cli.mjs extracted/norm/bin/norm "$NORM_CANDIDATE_VERSION" 2>&1 | tee validation-evidence/native.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-maven-validation-${{ github.sha }}
          path: |
            validation-evidence/
            release/
            build/reports/native-size/
          if-no-files-found: warn
