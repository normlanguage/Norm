name: Set up GraalVM Community 25.1.3
description: Install the pinned GraalVM Community toolchain from its verified release asset

runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $asset = switch ("$env:RUNNER_OS-$env:RUNNER_ARCH") {
          'Windows-X64' { @('graalvm-community-jdk-25i1-25.0.3_windows-x64_bin.zip', '96f1e7a9674b5b5751224104ff0c4624f15f9522b190d960a041cab72c381393') }
          'Linux-X64' { @('graalvm-community-jdk-25i1-25.0.3_linux-x64_bin.tar.gz', 'e9cd1637be853e105f8b09125b4b19fbce385696465d782cbca8bb80e1df8f0d') }
          'macOS-ARM64' { @('graalvm-community-jdk-25i1-25.0.3_macos-aarch64_bin.tar.gz', 'b41cdde27691a0e04a1f2b0660624bc37e59c738e536888860c4c9f65a4a9a3b') }
          default { throw "Unsupported GraalVM host: $env:RUNNER_OS-$env:RUNNER_ARCH" }
        }
        $archive = Join-Path $env:RUNNER_TEMP $asset[0]
        $uri = "https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.1.3/$($asset[0])"
        Invoke-WebRequest -Uri $uri -OutFile $archive
        $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $asset[1]) { throw "GraalVM archive checksum mismatch: $actual" }
        $destination = Join-Path $env:RUNNER_TEMP 'graalvm-community-25.1.3'
        New-Item -ItemType Directory -Path $destination | Out-Null
        if ($archive.EndsWith('.zip')) {
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
        } else {
          tar -xzf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the GraalVM archive' }
        }
        $java = Get-ChildItem -LiteralPath $destination -Recurse -File | Where-Object { $_.Name -in @('java', 'java.exe') } | Select-Object -First 1
        if ($null -eq $java) { throw 'The GraalVM archive does not contain Java' }
        $javaHome = $java.Directory.Parent.FullName
        "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GRAALVM_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $java.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $java.FullName --version
        $nativeImage = if ($env:RUNNER_OS -eq 'Windows') { 'native-image.cmd' } else { 'native-image' }
        & (Join-Path $java.Directory.FullName $nativeImage) --version
